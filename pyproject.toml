[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-image-analysis"
version = "0.1.0"
description = "Food detection and nutrition estimation using a fine-tuned YOLO model."
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.2.0",
  "opencv-python>=4.9.0",
  "pillow>=10.0.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0.0",
  "streamlit>=1.36.0",
]

[project.scripts]
food-analyze = "food_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
